<section class="main-tittle">
    <h1>Επικοινωνήστε μαζί μας</h1>
</section>

<main>
    <div class="menu-image-container">
        <img src="../images/raymond-petrik-b-PZxjOoUs8-unsplash.jpg" alt="Φάκελοι σφραγισμένοι με βουλοκέρι">
    </div>
    <form action="mailto:incrediblebites@gmail.com" method="post" enctype="text/plain">
        <div class="form-group">
            <label for="name">Ονοματεπώνυμο</label>
            <input type="text" id="name" placeholder="π.χ. Γιώργος Μαντζούκας" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="π.χ. name123@gmail.com" required>
        </div>
        <div class="form-group">
            <label for="message">Μήνυμα</label>
            <textarea id="message" rows="5" required placeholder="Το φαγητό ήταν εξαιρετικό!"></textarea>
        </div>
        <button type="submit" class="submit-btn">Αποστολή</button>
    </form>
</main>
